worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  log_format mcp_ext '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'host=$host scheme=$scheme '
                     'request_time=$request_time '
                     'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                     'upstream_time=$upstream_response_time '
                     'mcp_session=$http_mcp_session_id request_id=$request_id '
                     'xff=$http_x_forwarded_for ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher';

  access_log /dev/stdout mcp_ext;
  access_log /var/log/nginx/access.log mcp_ext;
  error_log /dev/stderr info;
  error_log /var/log/nginx/error.log info;

  server {
    listen 80;
    server_name mcp.scanmalware.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name mcp.scanmalware.com;

    ssl_certificate /etc/letsencrypt/live/mcp.scanmalware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.scanmalware.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
      try_files /index.html =404;
    }

    location /mcp {
      proxy_pass http://mcp:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600;
      proxy_buffering off;
    }

    location = /mcp/ {
      return 308 /mcp;
    }
  }
}
