[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanmalware-mcp"
version = "0.1.6"
description = "An MCP server for the ScanMalware.com API"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer and changed other
  # APIs, so this server does not import under it. Moving to 2.x is a migration,
  # not a version bump.
  "mcp>=1.14.0,<2",
  # server.py imports httpx directly. mcp 1.x happens to pull it in, but 2.x
  # switched to httpx2, so relying on the transitive dependency is not safe.
  "httpx>=0.27",
]

[project.scripts]
scanmalware-mcp = "scanmalware_mcp.server:main"

# Without this, setuptools' flat-layout auto-discovery sees both `deploy` and
# `scanmalware_mcp` as top-level packages and refuses to build. The Docker image
# only COPYs scanmalware_mcp/, so it built fine, but `pip install .` from a repo
# checkout - what the README tells you to run - failed.
[tool.setuptools]
packages = ["scanmalware_mcp"]
