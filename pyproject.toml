[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanmalware-mcp"
version = "0.1.4"
description = "An MCP server for the ScanMalware.com API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.14.0",
]

[project.scripts]
scanmalware-mcp = "scanmalware_mcp.server:main"
